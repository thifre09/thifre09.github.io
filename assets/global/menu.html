    <div id="title-div"><h1 id="title"><a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
        Meu site incrível

    <nav id="barra-main">
        <div onclick="abrirMenu(false)" class="botao-menu-lateral"><img src="assets/images/icones-uteis/menu.png"></div>
        <h6 id="titulo"><a href="#title">Bem vindo ao incrível site</a></h6>
    </nav>

    <div onclick="abrirMenu(false)" class="botao-menu-lateral" id="botao-menu-lateral-reserva" style="display: none;"><img src="assets/images/icones-uteis/menu.png"></div>

    <aside id="menu-lateral" style="display: none;">
        <button onclick="abrirMenu(true)" id="fechar-menu-lateral">Fechar</button>

        <button onclick="abrir(false, 'notas-atualizacao')">
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M852-212 732-332l56-56 120 120-56 56ZM708-692l-56-56 120-120 56 56-120 120Zm-456 0L132-812l56-56 120 120-56 56ZM108-212l-56-56 120-120 56 56-120 120Zm246-75 126-76 126 77-33-144 111-96-146-13-58-136-58 135-146 13 111 97-33 143ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Zm247-361Z"/></svg>
            <div>Notas da atualização</div>
        </button>       
        <button onclick="abrir(false, 'bloco-notas')">
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>

        <button onclick="abrir(false, 'calculadora')">

            <div>Calculadora</div>
        </button>
        <!--<button onclick="abrir(false, 'conquistas-geral')">Conquistas</button>-->
        <button onclick="abrir(false, 'configuracoes')">
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
            <div>Configurações</div>
        </button>

    </aside>

    <div class="aside-window" id="notas-atualizacao" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M852-212 732-332l56-56 120 120-56 56ZM708-692l-56-56 120-120 56 56-120 120Zm-456 0L132-812l56-56 120 120-56 56ZM108-212l-56-56 120-120 56 56-120 120Zm246-75 126-76 126 77-33-144 111-96-146-13-58-136-58 135-146 13 111 97-33 143ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Zm247-361Z"/></svg>
                <div>
                    <h1>Atualizações</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'notas-atualizacao')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>
        <div class="aside-scroll">
            <section id="notas-atualizacao-container">  
                
            </section>
        </div>

        <div class="resizer"></div>
    </div>

    <div class="aside-window" id="bloco-notas" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                <div>
                    <h1>Bloco de notas</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'bloco-notas')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>
        <div class="topo-notas">
            <div id="topo-notas-container">
                <h2>Minhas notas</h2>
                <button onclick="novaNota()">
                    <img src="assets/images/icones-uteis/edit.svg"> Nova nota
                </button>
            </div>

            <div id="topo-criar-nota" style="display: none;">
                <button onclick="voltarParaNotas()">
                    <img src="assets/images/icones-uteis/arrow.svg"> Voltar
                </button>
                <button onclick="criarNota()">
                    <img src="assets/images/icones-uteis/add.svg">Criar nota
                </button>
            </div>

            <div id="topo-editar-nota" style="display: none;">
                <button onclick="voltarParaNotas()">
                    <img src="assets/images/icones-uteis/arrow.svg"> Voltar
                </button>
                <button onclick="salvarAlteracoesNota()">
                    <img src="assets/images/icones-uteis/pencil.png">Editar Nota
                </button>
            </div>
        </div>
        <div class="aside-scroll">
            <section id="bloco-notas-container">
                <div id="notas-container">     
                    <div id="nenhuma-nota-ainda">
                        <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <line x1="10" y1="9" x2="8" y2="9"/>
                        </svg>
                        <h4>Nenhuma nota ainda</h4>
                        <h5>Clique em "Nova nota" para começar</h5>
                    </div>
                    
                    <div id="notas">
                        
                    </div>

                </div>

                <div id="criar-nota" style="display: none;">
                    <h5>Título</h5>
                    <textarea id="titulo-criar-nota" rows="1" placeholder="Digite o título da nota"></textarea>
                    <h5>Conteúdo</h5>
                    <textarea id="conteudo-criar-nota" rows="7" placeholder="Digite o conteúdo da nota"></textarea>
                </div>

                <div id="editar-nota" style="display: none;">
                    <h5>Título</h5>
                    <textarea id="titulo-editar-nota" rows="1" placeholder="Digite o título da nota"></textarea>
                    <h5>Conteúdo</h5>
                    <textarea id="conteudo-editar-nota" rows="7" placeholder="Digite o conteúdo da nota"></textarea>
                </div>
            </section>
        </div>

        <div class="resizer"></div>
    </div>

    <div class="aside-window" id="calculadora" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M320-240h60v-80h80v-60h-80v-80h-60v80h-80v60h80v80Zm200-30h200v-60H520v60Zm0-100h200v-60H520v60Zm44-152 56-56 56 56 42-42-56-58 56-56-42-42-56 56-56-56-42 42 56 56-56 58 42 42Zm-314-70h200v-60H250v60Zm-50 472q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg>
                <div>
                    <h1>Calculadora</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'calculadora')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="aside-scroll">
            <div class="calculator">
                <div class="display">
                    <div id="previous-operand"></div>
                    <div id="current-operand">0</div>
                </div>
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>        
                <button onclick="appendOperator('**')">xʸ</button> 
                <button onclick="calculateSqrt()">√</button>
                <button onclick="clearDisplay()">AC</button>
                <button onclick="deleteDigit()">DEL</button>

                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button onclick="appendOperator('+')">+</button>
                <button onclick="appendOperator('-')">-</button>
                <button onclick="appendOperator('*')">×</button>
                <button onclick="appendOperator('/')">÷</button>  

                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button onclick="appendNumber('0')">0</button>
                <button onclick="appendNumber('.')">.</button>  
                <button onclick="compute()" id="equal-button">=</button>
            </div>
        </div>

        <div class="resizer"></div>
    </div>

    <div class="aside-window" id="configuracoes" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
                <div>
                    <h1>Configurações</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'configuracoes')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="aside-scroll">
            <div>
                <h2>Desativar menu superior</h2>
                <input type="checkbox" id="toggle-banner" onchange="toggleBanner()">
            </div>
            <p style="margin-top: 50%;">Sim, só tem 1 configuração</p>
        </div>

        <div class="resizer"></div>
    </div>

</body>
