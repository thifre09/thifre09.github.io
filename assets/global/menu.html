<head>
    <link rel="stylesheet" href="assets/global/menu.css">
    <link rel="stylesheet" href="assets/global/variables.css">
</head>

<body>
    <div><h1 id="title"><a href="index.html">Meu site incrível</a></h1></div>

    <nav id="barra-main">
        <div onclick="abrirMenu(false)" class="botao-menu-lateral"><img src="assets/images/icones-uteis/menu.png"></div>
        <h6 id="titulo"><a href="#title">Bem vindo ao incrível site</a></h6>
    </nav>

    <div onclick="abrirMenu(false)" class="botao-menu-lateral" id="botao-menu-lateral-reserva" style="display: none;"><img src="assets/images/icones-uteis/menu.png"></div>

    <aside id="menu-lateral" style="display: none;">
        <button onclick="abrirMenu(true)" id="fechar-menu-lateral">Fechar</button>

        <button onclick="abrir(false, 'notas-atualizacao')">Notas da atualização</button>
        <button onclick="abrir(false, 'calculadora')">Calculadora</button>
        <button onclick="abrir(false, 'bloco-notas')">Bloco de notas</button>
        <!--<button onclick="abrir(false, 'conquistas-geral')">Conquistas</button>-->
        <!--<button onclick="abrir(false, 'configuracoes')">Configurações</button>-->

    </aside>

    <div class="aside-window" id="notas-atualizacao" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                    <path d="M5 3v4" />
                    <path d="M19 17v4" />
                    <path d="M3 5h4" />
                    <path d="M17 19h4" />
                </svg>
                <div>
                    <h1>Atualizações</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'notas-atualizacao')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>
        <div class="aside-scroll">
            <section id="notas-atualizacao-container">  
                
            </section>
        </div>

        <div class="resizer"></div>
    </div>

    <div class="aside-window" id="bloco-notas" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <line x1="10" y1="9" x2="8" y2="9"/>
                </svg> 
                <div>
                    <h1>Bloco de notas</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'bloco-notas')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>
        <div class="topo-notas">
            <div id="topo-notas-container">
                <h2>Minhas notas</h2>
                <button onclick="novaNota()">
                    <img src="assets/images/icones-uteis/edit.svg"> Nova nota
                </button>
            </div>

            <div id="topo-criar-nota" style="display: none;">
                <button onclick="voltarParaNotas()">
                    <img src="assets/images/icones-uteis/arrow.svg"> Voltar
                </button>
                <button onclick="criarNota()">
                    <img src="assets/images/icones-uteis/add.svg">Criar nota
                </button>
            </div>

            <div id="topo-editar-nota" style="display: none;">
                <button onclick="voltarParaNotas()">
                    <img src="assets/images/icones-uteis/arrow.svg"> Voltar
                </button>
                <button onclick="salvarAlteracoesNota()">
                    <img src="assets/images/icones-uteis/pencil.png">Editar Nota
                </button>
            </div>
        </div>
        <div class="aside-scroll">
            <section id="bloco-notas-container">
                <div id="notas-container">     
                    <div id="nenhuma-nota-ainda">
                        <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <line x1="10" y1="9" x2="8" y2="9"/>
                        </svg>
                        <h4>Nenhuma nota ainda</h4>
                        <h5>Clique em "Nova nota" para começar</h5>
                    </div>
                    
                    <div id="notas">
                        
                    </div>

                </div>

                <div id="criar-nota" style="display: none;">
                    <h5>Título</h5>
                    <textarea id="titulo-criar-nota" rows="1" placeholder="Digite o título da nota"></textarea>
                    <h5>Conteúdo</h5>
                    <textarea id="conteudo-criar-nota" rows="7" placeholder="Digite o conteúdo da nota"></textarea>
                </div>

                <div id="editar-nota" style="display: none;">
                    <h5>Título</h5>
                    <textarea id="titulo-editar-nota" rows="1" placeholder="Digite o título da nota"></textarea>
                    <h5>Conteúdo</h5>
                    <textarea id="conteudo-editar-nota" rows="7" placeholder="Digite o conteúdo da nota"></textarea>
                </div>
            </section>
        </div>

        <div class="resizer"></div>
    </div>

    <div class="aside-window" id="calculadora" style="display: none;">
        <header class="aside-window-header">   
            <div class="left-div">
                <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                    <path d="M5 3v4" />
                    <path d="M19 17v4" />
                    <path d="M3 5h4" />
                    <path d="M17 19h4" />
                </svg>
                <div>
                    <h1>Calculadora</h1>
                </div>
            </div>
            <div class="button-div">
                <button onclick="abrir(true, 'calculadora')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="aside-scroll">
            <div class="calculator">
                <div class="display">
                    <div id="previous-operand"></div>
                    <div id="current-operand">0</div>
                </div>
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>        
                <button onclick="appendOperator('**')">xʸ</button> 
                <button onclick="calculateSqrt()">√</button>
                <button onclick="clearDisplay()">AC</button>
                <button onclick="deleteDigit()">DEL</button>

                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button onclick="appendOperator('+')">+</button>
                <button onclick="appendOperator('-')">-</button>
                <button onclick="appendOperator('*')">×</button>
                <button onclick="appendOperator('/')">÷</button>  

                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button onclick="appendNumber('0')">0</button>
                <button onclick="appendNumber('.')">.</button>  
                <button onclick="compute()" id="equal-button">=</button>
            </div>
        </div>

        <div class="resizer"></div>
    </div>

</body>
